name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter "Category!=Live"
      - name: Тесты против сборки netstandard2.0
        run: dotnet test tests/Haskimail.Tests -c Release -f net10.0 -p:HaskimailTestTarget=netstandard2.0 --filter "Category!=Live"
      - run: dotnet pack -c Release -o nupkg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: nupkg
          path: nupkg

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Публикация Native AOT без предупреждений
        run: dotnet publish tests/Haskimail.AotSmoke -c Release -o aot -p:TreatWarningsAsErrors=true
      - run: ./aot/Haskimail.AotSmoke
